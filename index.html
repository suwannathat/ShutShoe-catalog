<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>งานซ่อมร้านชัชShoe — ผลงานตามแบรนด์แยกหมวดหมู่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1C1412;
    --surface: #261C17;
    --text: #E6D5C3;
    --text-muted: rgba(230,213,195,0.62);
    --text-faint: rgba(230,213,195,0.4);
    --border: rgba(197,168,128,0.28);
    --gold: #C5A880;
    --tab-active-bg: #C5A880;
    --tab-active-text: #1C1412;
    --active-tint: rgba(197,168,128,0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  .shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 95%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px;
  }
  .stripe {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    opacity: 0.6;
  }
  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    margin-left: -8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn:active { background: var(--active-tint); }
  .topbar-title { min-width: 0; }
  .topbar-title p:first-child {
    font-size: 19px;
    line-height: 1.25;
    letter-spacing: 0.01em;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-title p.sub {
    font-size: 12px;
    color: var(--text-muted);
    margin: 3px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Brand grid — editorial gallery tiles */
  .brand-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 20px;
  }
  .brand-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 112px;
    padding: 24px 12px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    color: var(--text);
    text-align: center;
    cursor: pointer;
    transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
  }
  .brand-tile:active {
    transform: scale(0.98);
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 0 24px rgba(197,168,128,0.35);
  }
  .brand-tile .name { font-size: 17px; letter-spacing: 0.01em; }
  .brand-tile .cta {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--gold);
    opacity: 0.8;
  }

  /* Tabs — gold pill segmented control */
  .tabs {
    display: flex;
    gap: 4px;
    margin: 16px 20px 0;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .tab-btn.active {
    background: var(--gold);
    color: var(--tab-active-text);
  }
  .tab-count { font-size: 11px; margin-left: 2px; opacity: 0.75; }

  .cat-desc {
    padding: 14px 20px 0;
    font-size: 12px;
    color: var(--text-faint);
    margin: 0;
  }

  .empty-state {
    padding: 64px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-faint);
  }

  /* Project card */
  .project-card {
    margin: 16px 20px 0;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    padding: 20px 0;
  }
  .project-code {
    padding: 0 20px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 16px;
    color: var(--text);
  }
  .project-note {
    padding: 4px 20px 0;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0;
  }
  .toggle-row {
    display: flex;
    gap: 8px;
    padding: 16px 20px 0;
  }
  .toggle-btn {
    flex: 1;
    height: 44px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .toggle-btn.active {
    background: var(--gold);
    color: var(--tab-active-text);
    border-color: var(--gold);
  }
  .gallery {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 16px 20px 4px;
    margin-top: 4px;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .gallery::-webkit-scrollbar { display: none; }
  .slot {
    flex-shrink: 0;
    width: 78%;
    aspect-ratio: 4/5;
    scroll-snap-align: start;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-faint);
    font-size: 12px;
    overflow: hidden;
  }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 14px; }

  footer.contact {
    padding: 32px 20px 40px;
    border-top: 1px solid var(--border);
    margin: 24px 20px 0;
  }
  footer.contact p {
    margin: 0 0 4px;
    font-size: 13px;
    color: var(--text-muted);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>
  // ============================================================
  // ข้อมูลร้าน — แก้ตรงนี้ได้เลย
  // ============================================================
  const SITE = {
    name: "งานซ่อมร้านชัชShoe",
    tagline: "ผลงานตามแบรนด์แยกหมวดหมู่",
    contact: "" // เช่น "โทร 081-234-5678 · LINE: @yourshop"
  };

  // ============================================================
  // แบรนด์ — เพิ่ม/ลบได้ที่นี่ { slug, name }
  // ============================================================
  const BRANDS = [
    { slug: "gucci", name: "Gucci" },
    { slug: "louis-vuitton", name: "Louis Vuitton" },
    { slug: "prada", name: "Prada" },
    { slug: "dior", name: "Dior" },
    { slug: "balenciaga", name: "Balenciaga" },
    { slug: "timberland", name: "Timberland" },
  ];

  const CATEGORIES = [
    { slug: "original", label: "พื้นตรงรุ่น", description: "งานเปลี่ยนพื้นตามสเปกโรงงานเดิม" },
    { slug: "alternative", label: "พื้นทดแทน", description: "งานเปลี่ยนพื้นทดแทนหรืออัปเกรด" },
  ];

  // ============================================================
  // ผลงาน — 1 อ็อบเจกต์ = การ์ด 1 ใบ
  // รูป: ใส่เป็น URL หรือ data URI ก็ได้ ถ้ายังไม่มีรูปปล่อย array ว่างไว้
  // ============================================================
  const PROJECTS = [
    {
      id: "gucci-014",
      brandSlug: "gucci",
      category: "original",
      code: "GC-014",
      note: "เปลี่ยนพื้นยางเดิมทั้งคู่ รักษาโครงเดิม 100%",
      before: [],
      after: [],
    },
    // ---- เพิ่มโปรเจกต์ถัดไปตรงนี้ ----
  ];

  // ============================================================
  // State
  // ============================================================
  let view = "home";
  let currentBrandSlug = null;
  let activeCategory = CATEGORIES[0].slug;
  let galleryView = {};

  const app = document.getElementById("app");

  const ChevronRightSVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>`;
  const ChevronLeftSVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M15 18l-6-6 6-6"/></svg>`;
  const ImageIconSVG = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>`;

  function esc(str) {
    const d = document.createElement("div");
    d.textContent = str ?? "";
    return d.innerHTML;
  }

  function getProjectsByBrandAndCategory(brandSlug, categorySlug) {
    return PROJECTS.filter(p => p.brandSlug === brandSlug && p.category === categorySlug);
  }
  function getCategoryCounts(brandSlug) {
    const out = {};
    CATEGORIES.forEach(c => { out[c.slug] = getProjectsByBrandAndCategory(brandSlug, c.slug).length; });
    return out;
  }

  function renderHome() {
    const tiles = BRANDS.map(b => `
      <button class="brand-tile" data-brand="${esc(b.slug)}">
        <span class="font-display name">${esc(b.name)}</span>
        <span class="cta">ดูผลงาน</span>
      </button>
    `).join("");

    app.innerHTML = `
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-title">
            <p class="font-display">${esc(SITE.name)}</p>
            <p class="sub">${esc(SITE.tagline)}</p>
          </div>
        </div>
        <div class="stripe"></div>
      </header>
      <div class="brand-grid">${tiles}</div>
      ${SITE.contact ? `<footer class="contact"><p>${esc(SITE.contact)}</p></footer>` : ""}
    `;

    app.querySelectorAll("[data-brand]").forEach(el => {
      el.addEventListener("click", () => {
        currentBrandSlug = el.getAttribute("data-brand");
        activeCategory = CATEGORIES[0].slug;
        view = "brand";
        render();
      });
    });
  }

  function renderGallerySlots(images, projectCode, label) {
    if (!images || images.length === 0) {
      return `<div class="slot"><span>${ImageIconSVG}</span><span>ยังไม่มีรูป${label}</span></div>`;
    }
    return images.map((src, i) => `
      <div class="slot"><img src="${esc(src)}" alt="${esc(projectCode)} ${esc(label)} ${i + 1}" loading="${i === 0 ? "eager" : "lazy"}"/></div>
    `).join("");
  }

  function renderProjectCard(project) {
    const gView = galleryView[project.id] || "after";
    const images = gView === "before" ? project.before : project.after;
    const label = gView === "before" ? "ก่อนซ่อม" : "หลังซ่อม";

    return `
      <article class="project-card">
        <p class="project-code">${esc(project.code)}</p>
        ${project.note ? `<p class="project-note">${esc(project.note)}</p>` : ""}
        <div class="toggle-row">
          <button class="toggle-btn ${gView === "before" ? "active" : ""}" data-toggle="${project.id}" data-val="before">ก่อน</button>
          <button class="toggle-btn ${gView === "after" ? "active" : ""}" data-toggle="${project.id}" data-val="after">หลัง</button>
        </div>
        <div class="gallery">${renderGallerySlots(images, project.code, label)}</div>
      </article>
    `;
  }

  function renderBrand() {
    const brand = BRANDS.find(b => b.slug === currentBrandSlug);
    if (!brand) { view = "home"; render(); return; }

    const counts = getCategoryCounts(brand.slug);
    const activeCat = CATEGORIES.find(c => c.slug === activeCategory);
    const projects = getProjectsByBrandAndCategory(brand.slug, activeCategory);

    const tabs = CATEGORIES.map(c => `
      <button class="tab-btn ${c.slug === activeCategory ? "active" : ""}" data-cat="${c.slug}">
        ${esc(c.label)} <span class="tab-count">(${counts[c.slug] ?? 0})</span>
      </button>
    `).join("");

    const cardsHtml = projects.length === 0
      ? `<div class="empty-state">ยังไม่มีผลงานในหมวดนี้</div>`
      : projects.map(renderProjectCard).join("");

    app.innerHTML = `
      <header class="topbar">
        <div class="topbar-inner">
          <button class="back-btn" id="backBtn" aria-label="ย้อนกลับ">${ChevronLeftSVG}</button>
          <div class="topbar-title">
            <p class="font-display">${esc(brand.name)}</p>
            <p class="sub">แคตตาล็อกผลงาน</p>
          </div>
        </div>
        <div class="stripe"></div>
      </header>
      <div class="tabs">${tabs}</div>
      <p class="cat-desc">${esc(activeCat?.description || "")}</p>
      <div>${cardsHtml}</div>
    `;

    document.getElementById("backBtn").addEventListener("click", () => {
      view = "home";
      render();
    });
    app.querySelectorAll("[data-cat]").forEach(el => {
      el.addEventListener("click", () => {
        activeCategory = el.getAttribute("data-cat");
        render();
      });
    });
    app.querySelectorAll("[data-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.getAttribute("data-toggle");
        galleryView[id] = el.getAttribute("data-val");
        render();
      });
    });
  }

  function render() {
    if (view === "home") renderHome();
    else renderBrand();
    window.scrollTo(0, 0);
  }

  render();
</script>
</body>
</html>
